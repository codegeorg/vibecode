const lessons = [
  {
    id: 'vectors', module: 0, title: 'Deine ersten Zeilen R', time: 15, eyebrow: 'KLEIN ANFANGEN. DIREKT AUSPROBIEREN.',
    intro: 'Jede Zeitreihe beginnt mit ein paar Werten. Du speicherst sie in einer Variable – und R merkt sie sich für dich.',

      ['c()', 'Werte verbinden', '„Combine“ verbindet mehrere Werte zu einem Vektor. Ein Vektor ist eine geordnete Liste gleichartiger Werte.'],
      ['mean()', 'Den Mittelwert berechnen', 'Addiert alle Zahlen und teilt durch ihre Anzahl. Mit length() erhältst du die Anzahl der Werte.'],
    ],
    task: 'Speichere die sechs Quartalswerte 10, 20, 21, 30, 15 und 21 als values. Lass dir den Vektor und seinen Mittelwert anzeigen.',

    solution: 'values <- c(10, 20, 21, 30, 15, 21)\nvalues\nmean(values)',
    check: 'exists("values") && isTRUE(all.equal(as.numeric(values), c(10,20,21,30,15,21)))',
    required: ['mean'], success: 'Dein erster R-Code läuft! Der Vektor hat 6 Werte, der Mittelwert ist 19,5. Als Nächstes greifst du gezielt auf einzelne Werte zu.',
  },
  {
    id: 'indexing', module: 0, title: 'Werte gezielt auswählen', time: 15,
    intro: 'Du brauchst selten alle Daten gleichzeitig. Mit eckigen Klammern wählst du genau die Beobachtungen aus, die dich interessieren.',
    commands: [['[ ]', 'Position auswählen', 'R zählt ab 1. values[1] liefert den ersten Wert, values[2:4] die Positionen 2 bis 4.'], ['length()', 'Die Länge ermitteln', 'length(values) liefert die Anzahl der Werte. So findest du auch die letzte Position.'], ['rev()', 'Reihenfolge umkehren', 'rev(values) dreht einen Vektor um. In deinen Unterlagen steht dafür values[length(values):1].']],
    task: 'Speichere den ersten Wert als first, den letzten als last und den umgedrehten Vektor als reversed.',
    hint: 'first <- values[1]; last <- values[length(values)]; reversed <- rev(values). Ein Semikolon trennt Befehle; eine neue Zeile genügt auch.',
    starter: 'values <- c(10, 20, 21, 30, 15, 21)\n\n# Erster Wert, letzter Wert, umgekehrte Reihenfolge\nfirst <- \nlast <- \nreversed <- \n',
    solution: 'values <- c(10, 20, 21, 30, 15, 21)\nfirst <- values[1]\nlast <- values[length(values)]\nreversed <- rev(values)\nfirst\nlast\nreversed',
    check: 'exists("first") && exists("last") && exists("reversed") && first == 10 && last == 21 && identical(as.numeric(reversed), c(21,15,30,21,20,10))',
    success: 'Genau: R beginnt bei Position 1. Deine Zeitreihen müssen später von der ältesten zur neuesten Beobachtung sortiert sein.',
  },
  {
    id: 'timeseries', module: 0, title: 'Aus Zahlen wird eine Zeitreihe', time: 20,
    intro: 'Ein Vektor kennt keine Jahreszahlen. ts() ergänzt den Startzeitpunkt und die Häufigkeit. Jetzt versteht R, wann deine Werte beobachtet wurden.',
    commands: [['ts()', 'Zeitinformation ergänzen', 'start = c(2022, 1) bedeutet: erster Zeitraum in 2022. frequency = 4 steht für vier Beobachtungen pro Jahr.'], ['plot()', 'Die Zeitreihe zeichnen', 'Eine Grafik macht Trends, Ausreißer und Saisonalität sichtbar. Die Zeitachse entsteht aus deinem ts-Objekt.'], ['frequency()', 'Die Frequenz prüfen', '12 = monatlich, 4 = quartalsweise, 1 = jährlich. frequency zählt Beobachtungen pro Zeitzyklus, nicht die Gesamtzahl.']],
    task: 'Erstelle series0 aus values: Beginn im 1. Quartal 2022, Frequenz 4. Zeichne die Zeitreihe mit plot().',
    hint: 'series0 <- ts(values, start = c(2022, 1), frequency = 4). Danach plot(series0).',
    starter: 'values <- c(10, 20, 21, 30, 15, 21)\n\n# Ergänze Start und Frequenz\nseries0 <- ts(values, start = c(2022, 1), frequency = )\n\n# Zeichne deine erste Zeitreihe\n',
    solution: 'values <- c(10, 20, 21, 30, 15, 21)\nseries0 <- ts(values, start = c(2022, 1), frequency = 4)\nseries0\nplot(series0, type = "o", col = "#19786c", lwd = 2, xlab = "Jahr", ylab = "Wert")',
    check: 'exists("series0") && is.ts(series0) && frequency(series0) == 4 && isTRUE(all.equal(as.numeric(start(series0)), c(2022,1))) && length(series0)==6', required: ['plot'],
    success: 'Die Zeitachse stimmt: sechs Quartale von 2022 Q1 bis 2023 Q2. Bei monatlichen Daten würdest du frequency = 12 verwenden.',
  },
  {
    id: 'import', module: 1, title: 'Deine erste CSV-Datei', time: 25,
    intro: 'Bevor du analysierst, liest du Daten ein. Im Studio liegt visitors.csv bereit: ein synthetischer Übungsdatensatz mit zwei Kommentarzeilen und monatlichen Besucherzahlen.',
    commands: [['read.table()', 'Eine Textdatei einlesen', 'skip = 2 überspringt zwei Zeilen; header = TRUE nutzt die nächste Zeile als Spaltennamen.'], ['sep / na.strings', 'Das Dateiformat beschreiben', 'sep = "," trennt Spalten am Komma. na.strings = ".." liest fehlende Angaben als NA. Der vollständige Argumentname lautet na.strings.'], ['head() / str()', 'Den Import kontrollieren', 'head(data) zeigt die ersten Zeilen, str(data) Datentypen und Spaltennamen. data[, 2] wählt die zweite Spalte aus.']],
    task: 'Lies visitors.csv als data ein. Wandle die zweite Spalte in visitors um: monatlich, ab Januar 2018. Zeichne die Zeitreihe.',
    hint: 'read.table("visitors.csv", skip = 2, header = TRUE, sep = ",", na.strings = ".."). Die Werte erhältst du mit data[, 2].',
    starter: 'data <- read.table("visitors.csv", skip = 2,\n                   header = TRUE, sep = ",", na.strings = "..")\nhead(data)\n\n# Zweite Spalte in eine monatliche Zeitreihe umwandeln\nvisitors <- \n\n',
    solution: 'data <- read.table("visitors.csv", skip = 2, header = TRUE, sep = ",", na.strings = "..")\nhead(data)\nstr(data)\nvisitors <- ts(data[, 2], start = c(2018, 1), frequency = 12)\nplot(visitors, col = "#19786c", ylab = "Besucher")',
    check: 'exists("data") && is.data.frame(data) && exists("visitors") && is.ts(visitors) && frequency(visitors)==12 && length(visitors)==96 && isTRUE(all.equal(as.numeric(visitors), training_visitors))', required: ['read.table','plot'],
    success: 'Import geschafft. Kontrolliere in echten Dateien immer Trennzeichen, Dezimalzeichen, Reihenfolge und fehlende Werte.',
  },
  {
    id: 'cleaning', module: 1, title: 'Preise bereinigen & sortieren', time: 25,
    intro: 'Aktienkurse kommen oft als Text mit Dollarzeichen und in umgekehrter Zeitreihenfolge. Du entfernst zuerst das Symbol, wandelst in Zahlen um und sortierst chronologisch.',
    commands: [['gsub()', 'Ein Zeichen ersetzen', 'gsub("$", "", prices, fixed = TRUE) entfernt jedes wörtliche Dollarzeichen. Ohne fixed = TRUE ist $ ein regulärer Ausdruck.'], ['as.numeric()', 'Text in Zahlen verwandeln', 'as.numeric("67") ergibt 67. as.numeric("$67") ergibt NA mit Warnung – deshalb zuerst bereinigen.'], ['rev()', 'Älteste Beobachtung zuerst', 'Die Rohdaten dieser Aufgabe stehen von neu nach alt. rev() kehrt sie um. frequency = 250 ist bei Handelstagen nur eine Näherung.']],
    task: 'Bereinige prices, drehe die Reihenfolge um und speichere das numerische Ergebnis als clean_prices. Erstelle daraus apple_close mit Frequenz 250 und Beginn c(2025, 166).',
    hint: 'clean_prices <- rev(as.numeric(gsub("$", "", prices, fixed = TRUE))). Anschließend ts(clean_prices, start = c(2025, 166), frequency = 250).',
    starter: 'prices <- c("$230", "$225", "$220", "$218", "$215")\n\n# Dollarzeichen entfernen, Zahlen konvertieren, umdrehen\nclean_prices <- \n\napple_close <- \n',
    solution: 'prices <- c("$230", "$225", "$220", "$218", "$215")\nclean_prices <- rev(as.numeric(gsub("$", "", prices, fixed = TRUE)))\nclean_prices\napple_close <- ts(clean_prices, start = c(2025, 166), frequency = 250)\nplot(apple_close, type = "o", col = "#19786c")',
    check: 'exists("clean_prices") && identical(as.numeric(clean_prices), c(215,218,220,225,230)) && exists("apple_close") && is.ts(apple_close) && frequency(apple_close)==250 && isTRUE(all.equal(as.numeric(apple_close), as.numeric(clean_prices)))',
    success: 'Deine Kurse sind numerisch und chronologisch sortiert. Echte Handelstage sind unregelmäßig; ts mit Frequenz 250 bildet den Kalender nur näherungsweise ab.',
  },
  {
    id: 'reshaping', module: 1, title: 'Tabellen in eine Reihe bringen', time: 25,
    intro: 'In vielen Dateien steht ein Jahr pro Zeile und ein Monat pro Spalte. R liest Matrizen spaltenweise. Mit t() drehst du sie vor dem Zusammenfügen richtig herum.',
    commands: [['as.matrix()', 'Eine Tabelle zur Matrix machen', 'Eine Matrix ist ein rechteckiger Datenblock mit einem gemeinsamen Datentyp. Wähle vorher nur numerische Messwerte aus.'], ['t() + c()', 'Zeilenweise aneinanderhängen', 'c(as.matrix(...)) liest Spalten nacheinander. Für Jahre in Zeilen brauchst du c(t(as.matrix(...))). In deinen Wohnpreis-Daten kann die Orientierung anders sein.'], ['window()', 'Einen Zeitraum auswählen', 'window(series, end = c(2024, 3)) schneidet nach Q3 2024 ab und bewahrt die Zeitinformation. Fehlende Werte in der Mitte nicht einfach entfernen.']],
    task: 'Verbinde die Quartale von tab zeilenweise zu series. Erstelle dwelling_price ab 2023 Q1 mit Frequenz 4 und entferne das letzte fehlende Quartal mit window().',
    hint: 'series <- c(t(as.matrix(tab))). Erzeuge die ts-Reihe mit acht Quartalen und verwende window(..., end = c(2024, 3)).',
    starter: 'tab <- data.frame(Q1 = c(100, 112), Q2 = c(103, 116),\n                  Q3 = c(105, 119), Q4 = c(108, NA))\n\nseries <- \ndwelling_price <- \n',
    solution: 'tab <- data.frame(Q1 = c(100, 112), Q2 = c(103, 116), Q3 = c(105, 119), Q4 = c(108, NA))\nseries <- c(t(as.matrix(tab)))\ndwelling_price <- ts(series, start = c(2023, 1), frequency = 4)\ndwelling_price <- window(dwelling_price, end = c(2024, 3))\ndwelling_price\nplot(dwelling_price, col = "#19786c")',
    check: 'exists("dwelling_price") && is.ts(dwelling_price) && frequency(dwelling_price)==4 && identical(as.numeric(dwelling_price), c(100,103,105,108,112,116,119)) && isTRUE(all.equal(as.numeric(end(dwelling_price)),c(2024,3)))',
    success: 'Die Quartale sind in der richtigen Reihenfolge. Bevor du t() verwendest, prüfe immer, wie die Ursprungsdatei aufgebaut ist.',
  },
  {
    id: 'decomposition', module: 2, title: 'Trend, Saison & Rest trennen', time: 25,
    intro: 'Eine Zeitreihe lässt sich oft in Trend, saisonales Muster und Rest zerlegen. Additiv heißt: Y = T + S + R. Multiplikativ heißt: Y = T × S × R.',
    commands: [['decompose()', 'Klassisch zerlegen', 'decompose(visitors) nutzt das additive Modell. Für multiplikative Zerlegung müssen alle Werte positiv sein. Mindestens zwei volle Saisons sind nötig.'], ['stl()', 'Saisonalität flexibel glätten', 'stl(visitors, s.window = "periodic") nutzt ein konstantes saisonales Muster. Ein ungerades Fenster wie 7 erlaubt saisonale Veränderungen.'], ['$random', 'Die Restkomponente auswählen', 'obj$random greift auf den Rest zu. SSE heißt sum(residuals^2), nicht sum(residuals). Additive und multiplikative Reste haben unterschiedliche Skalen.']],
    task: 'Erzeuge additive als additive Zerlegung der bereitstehenden visitors. Speichere die quadrierte Restsumme als sse und zeichne die Zerlegung.',
    hint: 'additive <- decompose(visitors); sse <- sum(additive$random^2, na.rm = TRUE). Die Randwerte sind oft NA.',
    starter: '# visitors ist bereits als monatlicher Übungsdatensatz verfügbar\nadditive <- \n\n# Wichtig: Residuen zuerst quadrieren\nsse <- \n',
    solution: 'additive <- decompose(visitors)\nsse <- sum(additive$random^2, na.rm = TRUE)\nsse\nplot(additive)\n# Alternative: plot(stl(visitors, s.window = "periodic"))',
    check: 'exists("additive") && inherits(additive,"decomposed.ts") && exists("sse") && isTRUE(all.equal(sse,sum(decompose(visitors)$random^2,na.rm=TRUE)))', required: ['plot'],
    note: 'Korrektur deiner Vorlage: sum(obj$random) ist keine SSE. Außerdem beweist ein kleinerer Rest auf einer anderen Skala kein besseres Modell.',
    success: 'Du hast Trend, Saison und Rest getrennt und die SSE korrekt berechnet. Sie ist nur zwischen vergleichbaren Fehlern auf derselben Skala sinnvoll.',
  },
  {
    id: 'smoothing', module: 2, title: 'Gleitende Durchschnitte', time: 25,
    intro: 'Glättung reduziert kurzfristiges Rauschen. Bei einem gleitenden Durchschnitt wird jeder Wert durch einen gewichteten Mittelwert seiner Nachbarn ersetzt.',
    commands: [['filter()', 'Gewichtet glätten', 'filter(y, filter = rep(1/4, 4), sides = 1) verwendet vier Werte einschließlich des aktuellen. Am Anfang fehlen frühere Werte: NA ist hier erwartbar.'], ['rep()', 'Gewichte wiederholen', 'rep(1/4, 4) ergibt viermal 0,25. Die Gewichte müssen für einen Mittelwert zusammen 1 ergeben.'], ['sides', 'Rückblickend oder zentriert', 'sides = 1 nutzt Gegenwart und Vergangenheit. sides = 2 zentriert das Fenster. Eine zentrierte Jahresglättung für Monatsdaten nutzt 13 Gewichte: 1/24, elfmal 1/12, 1/24.']],

function highlight(code){
 const regex=/(#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:TRUE|FALSE|NULL|NA|Inf|NaN|function|if|else|for|while|in)\b|\b\d+(?:\.\d+)?\b|[a-zA-Z_.][\w.]*(?=\s*\()|<-|\|>)/g;
 let last=0,html='',match;
 while((match=regex.exec(code))){html+=escapeHTML(code.slice(last,match.index));const s=match[0];const type=s.startsWith('#')?'comment':s.startsWith('"')||s.startsWith("'")?'string':/^\d/.test(s)?'number':s==='<-'||s==='|>'?'operator':/^(TRUE|FALSE|NULL|NA|Inf|NaN|function|if|else|for|while|in)$/.test(s)?'keyword':'function';html+=`<span class="syntax-${type}">${escapeHTML(s)}</span>`;last=regex.lastIndex;}
 return html+escapeHTML(code.slice(last))+'\n';
}

const seedCode=`set.seed(2026)\n.training_month <- 0:95\ntraining_visitors <- round(12000 + 65 * .training_month + 2900 * sin(2*pi*.training_month/12) + rnorm(96,0,460))\nvisitors <- ts(training_visitors, start=c(2018,1), frequency=12)\ncpi <- ts(100*exp(0.003*(0:119)) + rnorm(120,0,0.55), start=c(2016,1),frequency=12)\ny <- ts(60+cumsum(as.numeric(arima.sim(model=list(ma=-0.5),n=96))),start=c(2018,1),frequency=12)\n.course_calls <- function(x) { if (is.expression(x) || is.list(x)) return(unlist(lapply(x,.course_calls))); if (!is.call(x)) return(character()); c(if(is.symbol(x[[1]])) as.character(x[[1]]) else character(), unlist(lapply(as.list(x)[-1], .course_calls))) }\noptions(width=65, warn=1)\nwriteLines(c("# Synthetische Uebungsdaten: R Lernstudio", "# Monatsdaten 2018-2025"), "visitors.csv")\nsuppressWarnings(write.table(data.frame(month=sprintf("%d-%02d",rep(2018:2025,each=12),rep(1:12,8)),visitors=training_visitors),"visitors.csv",sep=",",row.names=FALSE,col.names=TRUE,append=TRUE))`;
async function initRuntime(){
 if(runtimeReady)return true;if(runtimeLoading)return runtimePromise;
 runtimeLoading=true;runtimeError='';updateRuntimeStatus();
 const generation=++runtimeGeneration;let instance;
 runtimePromise=(async()=>{
 try{
  const {WebR,ChannelType}=await import(WEBR_BASE + 'webr.mjs');
  instance=new WebR({baseUrl:WEBR_BASE,channelType:globalThis.crossOriginIsolated?ChannelType.SharedArrayBuffer:ChannelType.PostMessage,interactive:false});
  runtime=instance;
  await withTimeout(instance.init(),45000,'Das Laden von R dauert zu lange. Prüfe die Verbindung und versuche es erneut.');
  if(generation!==runtimeGeneration)return false;
  await withTimeout(instance.evalRVoid(seedCode),30000,'Die R-Übungsdaten konnten nicht vorbereitet werden. Bitte erneut laden.');
  if(generation!==runtimeGeneration)return false;
  runtimeVersion=await instance.evalRString('paste(R.version$major, R.version$minor, sep=".")');
  practiceShelter=await new runtime.Shelter();practiceEnv=await practiceShelter.evalR('new.env(parent=globalenv())');
  if(generation!==runtimeGeneration)return false;
  importedFiles=new Set(['visitors.csv']);
  runtimeReady=true;runtimeLoading=false;updateRuntimeStatus();return true;
 }catch(e){if(generation!==runtimeGeneration)return false;runtimeError=String(e.message||e);runtimeLoading=false;runtimeReady=false;try{runtime?.close();}catch{}updateRuntimeStatus();if($('#console-output')){$('#console-output').textContent=`R konnte nicht geladen werden.\n${runtimeError}\n\nKlicke oben auf „Erneut laden“. Für die R-Laufzeit brauchst du eine Internetverbindung. Öffne diese Datei in einem aktuellen Chrome, Edge oder Firefox und klicke auf „Erneut laden“.`;$('#console-output').className='console-output console-error';}return false;}
 })();return runtimePromise;
}
async function ensureRuntime(){if(runtimeReady)return true;return initRuntime();}
function updateRuntimeStatus(){const el=$('#runtime-status');if(!el)return;el.className=`runtime-status ${runtimeReady?'ready':runtimeLoading?'loading':'error'}`;el.innerHTML=`<span class="status-dot"></span>${runtimeReady?`R ${runtimeVersion} bereit`:runtimeLoading?'R wird geladen …':'Erneut laden'}`;el.title=runtimeReady?'Echtes R läuft lokal in deinem Browser':runtimeError||'Die R-Laufzeit startet. Das erste Laden kann etwas dauern.';}
function withTimeout(promise,ms,message){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(message)),ms);})]).finally(()=>clearTimeout(timer));}
function updateBusy(){const run=$('#run-code'),stop=$('#stop-code'),check=$('#check-code'),e=$('#code-editor');if(run){run.disabled=busy;run.innerHTML=busy?'<span class="loading-spinner"></span>R rechnet …':`${icon('play')}Code ausführen`;}if(stop)stop.hidden=!busy;if(check)check.disabled=busy;if(e)e.readOnly=busy;}
function feedback(success,message){const el=$('#check-feedback');if(!el)return;el.className=`check-feedback ${success?'success':'error'}`;el.innerHTML=`${icon(success?'checkCircle':'lightbulb')}<p>${escapeHTML(message)}</p>`;}
function friendlyError(error){const raw=String(error.message||error).replace(/^Error:\s*/,'');if(/unexpected|INCOMPLETE_STRING|parse error/i.test(raw))return `${raw}\n\nTipp: Prüfe Kommas, Anführungszeichen und geschlossene Klammern. Ein Platzhalter nach <- oder = braucht noch einen Wert.`;if(/not found|nicht gefunden/i.test(raw))return `${raw}\n\nTipp: Wurde die Variable schon angelegt? R unterscheidet Groß- und Kleinschreibung.`;if(/cannot open|No such file/i.test(raw))return `${raw}\n\nTipp: visitors.csv ist vorbereitet. Eigene Dateien kannst du im freien Übungsraum laden.`;return raw;}
async function execute(check=false){
 if(busy||!$('#code-editor'))return;
 const code=$('#code-editor').value,lesson=currentLesson,view=activeView,ticket=++runTicket;
 if(!code.trim()){toast('Schreibe zuerst etwas R-Code in den Editor.');return;}
 busy=true;updateBusy();let shelter;
 try{
  if(!await ensureRuntime())return;
  if(ticket!==runTicket)return;
  shelter=view==='practice'?practiceShelter:await new runtime.Shelter();
  const env=view==='practice'?practiceEnv:await shelter.evalR('new.env(parent=globalenv())');
  const res=await withTimeout(shelter.captureR(code,{env,withAutoprint:true,captureStreams:true,captureGraphics:{width:900,height:550,pointsize:14,bg:'white'},throwJsException:false}),20000,'Zeitlimit erreicht. Die R-Sitzung wird neu gestartet.');
  if(ticket!==runTicket){res.images.forEach(i=>i.close?.());return;}
  let hadError=false;
  const outputLines=[];
  for(const output of res.output){
   if(output.type==='stdout'||output.type==='stderr'){outputLines.push(String(output.data));continue;}
   if(['error','warning','message'].includes(output.type)){
    // webR returns R condition objects as proxies, not plain JS errors.
    let message;
    if(typeof output.data==='string')message=output.data;
    else if(typeof output.data?.get==='function')message=await (await output.data.get('message')).toString();
    else message=output.data?.message || 'Unbekannte R-Meldung';
    if(output.type==='error')hadError=true;
    outputLines.push((output.type==='error'?'Fehler: ':output.type==='warning'?'Hinweis: ':'')+message);
   }
  }
  currentOutput=outputLines.filter(Boolean).join('\n');
  if(!currentOutput)currentOutput=res.images.length?'Grafik erstellt. Du findest sie im Tab „Plots“.':'✓ Code ausgeführt. Eine Zuweisung speichert Werte, gibt sie aber nicht automatisch aus. Schreibe den Variablennamen in eine neue Zeile, um sie anzusehen.';
  if(hadError)currentOutput=friendlyError({message:currentOutput});
  if(activeView!==view||(view==='lesson'&&currentLesson.id!==lesson.id)){res.images.forEach(i=>i.close?.());return;}
  $('#console-output').textContent=currentOutput;$('#console-output').className=`console-output ${hadError?'console-error':''}`;
  currentImages.forEach(i=>i.close?.());currentImages=res.images;
  $('#plot-count').textContent=String(res.images.length);const plots=$('#plot-output');plots.replaceChildren();
  if(res.images.length){for(const im of res.images){const canvas=document.createElement('canvas');canvas.width=im.width;canvas.height=im.height;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`R-Grafik ${plots.children.length+1} aus deinem Code`);canvas.getContext('2d').drawImage(im,0,0);plots.append(canvas);}setOutputTab('plot');}else{plots.innerHTML='<p class="empty-plot">Noch keine Grafik. Nutze plot(), acf() oder pacf().</p>';setOutputTab('console');}
  if(check&&view==='lesson'){
   if(hadError){feedback(false,'Dein Code enthält noch einen Fehler. Schau in die Konsole – dort findest du einen Hinweis.');setOutputTab('console');return;}
   const calls=lesson.required||[];
   const checkExpr=`isTRUE(tryCatch({(${lesson.check}) && all(${calls.length?`c(${calls.map(c=>JSON.stringify(c)).join(',')})`:'character()'} %in% .course_calls(parse(text=${JSON.stringify(code)})))}, error=function(e) FALSE))`;
   const passed=await runtime.evalRBoolean(checkExpr,{env});
   checkPassed=passed;
   if(passed){if(!state.completed.includes(lesson.id)){state.completed.push(lesson.id);save();}feedback(true,lesson.success);renderSidebar();updateProgressCard();$('#check-code').hidden=true;$('#next-lesson').hidden=false;toast('Geschafft! Dein Fortschritt wurde gespeichert.');}
   else{feedback(false,'Noch nicht ganz. Prüfe die Variablennamen, die geforderten Werte und ob alle Schritte der Aufgabe im Code stehen. Dein Tipp hilft dir beim nächsten Versuch.');}
  }
 }catch(e){if(ticket!==runTicket)return;if(activeView===view&&$('#console-output')){$('#console-output').textContent=friendlyError(e);$('#console-output').className='console-output console-error';setOutputTab('console');if(check&&activeView==='lesson')feedback(false,'Der Code konnte noch nicht erfolgreich geprüft werden. Schau dir den Hinweis in der Konsole an.');}if(/Zeitlimit/.test(e.message)){stopExecution(false);toast('Die lange Berechnung wurde beendet. R wird neu geladen.');await initRuntime();}}
 finally{if(shelter&&shelter!==practiceShelter){try{await shelter.purge();}catch{}}if(ticket===runTicket){busy=false;updateBusy();}}
}

async function uploadFile(event){const file=event.target.files[0];if(!file)return;if(file.size>5*1024*1024){toast('Bitte verwende eine Textdatei mit höchstens 5 MB.');return;}if(!await ensureRuntime())return;const name=file.name.replace(/[^a-zA-Z0-9_.-]/g,'_');if(importedFiles.has(name)){toast('Dieser Dateiname ist bereits belegt. Benenne deine Datei vor dem Laden um.');event.target.value='';return;}try{await runtime.FS.writeFile(`/home/web_user/${name}`,new Uint8Array(await file.arrayBuffer()));importedFiles.add(name);$('#uploaded-status').textContent=`Geladen: ${name}. Verwende read.table("${name}", header = TRUE, sep = ";") und passe Trennzeichen, Dezimalzeichen und Kopfzeile an deine Datei an. Die Datei bleibt bis zum Neustart von R verfügbar.`;toast(`${name} ist jetzt in R verfügbar.`);}catch{toast('Die Datei konnte nicht geladen werden. Bitte versuche es erneut.');}}
function downloadCourse(){const text=`# R Lernstudio – Musterloesungen\n# Synthetische Uebungsdaten, nicht die Originaldateien aus dem Kurs.\n# Ausfuehrbar in Base R. Dateien werden im Arbeitsverzeichnis erzeugt.\n\n${seedCode}\n\n${lessons.map((l,i)=>`# ${'='.repeat(58)}\n# ${i+1}. ${l.title}\n# ${l.task}\n${l.note?'# HINWEIS: '+l.note+'\n':''}${l.solution}\n\n# Basisreihen fuer die naechste unabhaengige Aufgabe wiederherstellen\nvisitors <- ts(training_visitors, start=c(2018,1),frequency=12)\n`).join('\n')}`;download('r-lernstudio-musterloesungen.R',text);}
function showSearch(){openModal('Was möchtest du lernen?',`<label class="search-field">${icon('search')}<input id="global-search" placeholder="Lektion, Befehl oder Thema suchen …" aria-label="Lektionen durchsuchen" autocomplete="off"></label><div class="search-results" id="search-results"></div>`,()=>{const search=$('#global-search');const update=()=>{const q=search.value.toLowerCase();const results=lessons.filter(l=>`${l.title} ${l.intro} ${l.commands.flat().join(' ')}`.toLowerCase().includes(q));$('#search-results').innerHTML=results.length?results.map(l=>`<a class="search-result" href="#lesson/${l.id}">${icon(modules[l.module].icon)}${l.title}<span>${l.time} Min. →</span></a>`).join(''):'<p class="muted-note">Keine passende Lektion gefunden.</p>';$$('.search-result').forEach(a=>a.onclick=closeModal);};search.oninput=update;update();search.focus();});}
$('#search-trigger').onclick=showSearch;
$('#help-button').onclick=()=>openModal('Schön, dass du da bist.',`<p>Du brauchst keine R-Vorkenntnisse. Arbeite dich von oben nach unten durch den Lernpfad – oder springe zu einem Thema, das du wiederholen möchtest.</p><ul><li><strong>Lesen:</strong> Links werden die Befehle erklärt. In der grünen Karte steht deine Aufgabe.</li><li><strong>Ausprobieren:</strong> Bearbeite den R-Code rechts. „Code ausführen“ oder Ctrl/⌘ + Enter berechnet das Ergebnis.</li><li><strong>Verstehen:</strong> In der Konsole stehen Werte und Fehlermeldungen. Grafiken erscheinen unter „Plots“.</li><li><strong>Prüfen:</strong> „Lösung prüfen“ kontrolliert die Ergebnisse. Nur erfolgreich geprüfte Übungen zählen zum Fortschritt.</li><li><strong>Nachschlagen:</strong> Tipps und Musterlösungen helfen dir weiter. Mit Ctrl/⌘ + K suchst du im Kurs.</li></ul><p>Deine Entwürfe und dein Fortschritt werden lokal in diesem Browser gespeichert. Nutze den Download-Button für eine zusätzliche Kopie deines Codes. R läuft vollständig im Browser, ohne Daten an einen R-Server zu senden.</p><div class="modal-actions"><button class="primary-button" data-close>Los geht’s${icon('arrow')}</button></div>`);
$('#mobile-menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#mobile-menu').setAttribute('aria-expanded',String(open));};
document.addEventListener('click',e=>{if(window.innerWidth<=700&&!$('#sidebar').contains(e.target)&&!$('#mobile-menu').contains(e.target)){$('#sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#modal').open)showSearch();}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!$('#modal').open&&$('#code-editor')){e.preventDefault();execute(false);}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');}});
setInterval(()=>{if(document.visibilityState==='visible'){state.minutes=(Number(state.minutes)||0)+1;save();}},60000);
window.addEventListener('hashchange',route);
hydrateIcons();route();updateStorageNotice();initRuntime();

</script>
